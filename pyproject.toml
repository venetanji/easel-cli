[project]
name = "easel-cli"
version = "0.1.0"
description = "Generate images from Easel's OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
easel = "easel_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easel_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
